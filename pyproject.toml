[project]
name = "cap-application-processing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MiguelPadillaR", email = "m.padi.r@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "sigpac-tools",
    "structlog>=26.1.0",
]

[project.scripts]
cap-application-processing = "cap_application_processing:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
sigpac-tools = { git = "https://github.com/KhaosResearch/sigpac-tools.git", rev = "dev" }
